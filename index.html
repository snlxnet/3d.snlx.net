<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>3D viewer | snlx.net</title>
    <style>
      body {
        height: 100dvh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 18px;
        font-family: monospace;
        background: #cdd6f4;
        color: #1e1e2e;
        transition: 1s background;
      }
      #loading {
        z-index: 10;
        transition: 1s ease-in;
        pointer-events: none;
      }
      img {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
      }
      .hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <img src="/gears.svg">
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
